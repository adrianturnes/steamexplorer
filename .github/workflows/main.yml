name: Main

on:
  push:
    branches: [ main ]

jobs:
  tests-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: build
        run: make install

      - name: composer
        run: make composer

      - name: unit tests
        run: make test-unit

  tests-acceptance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: build
        run: |
          make install
          cp .env.example .env
          make composer
          docker compose exec steam-php php artisan key:generate
          docker compose exec steam-database bash -c "until mysqladmin ping -h localhost --silent; do sleep 1; done"
          sleep 10
          docker compose exec steam-php php artisan migrate
          docker compose exec steam-php php artisan db:seed

      - name: Acceptance tests
        run: make test-acceptance

  tests-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: build
        run: |
          make install
          cp .env.example .env
          make composer
          docker compose exec steam-php php artisan key:generate
          docker compose exec steam-database bash -c "until mysqladmin ping -h localhost --silent; do sleep 1; done"
          sleep 10
          docker compose exec steam-php php artisan migrate
          docker compose exec steam-php php artisan db:seed

      - name: Integration tests
        run: make test-integration

  coverage:
    runs-on: ubuntu-latest
    needs: [ tests-unit, tests-integration, tests-acceptance ]
    steps:
      - uses: actions/checkout@v3

      - name: build
        run: |
          make install
          cp .env.example .env
          make composer
          docker compose exec steam-php php artisan key:generate
          docker compose exec steam-database bash -c "until mysqladmin ping -h localhost --silent; do sleep 1; done"
          sleep 10
          docker compose exec steam-php php artisan migrate
          docker compose exec steam-php php artisan db:seed

      - name: coverage
        run: make coverage-report

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-docker-fpm:
    runs-on: ubuntu-latest
    needs: [ tests-unit, tests-integration, tests-acceptance ]
    steps:
      - uses: actions/checkout@v4
      - name: Login to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} \
          -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build image
        run: |
          docker build -f docker/php/prod/fpm/Dockerfile -t registry.adrianturnes.es/steam-explorer-fpm:${{ github.sha }} .

      - name: Push image
        run: |
          docker tag registry.adrianturnes.es/steam-explorer-fpm:${GITHUB_SHA} registry.adrianturnes.es/steam-explorer-fpm:latest
          docker push registry.adrianturnes.es/steam-explorer-fpm:latest

  build-docker-cli:
    runs-on: ubuntu-latest
    needs: [ tests-unit, tests-integration, tests-acceptance ]
    steps:
      - uses: actions/checkout@v4
      - name: Login to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} \
          -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build image
        run: |
          docker build -f docker/php/prod/cli/Dockerfile -t registry.adrianturnes.es/steam-explorer-cli:${{ github.sha }} .

      - name: Push image
        run: |
          docker tag registry.adrianturnes.es/steam-explorer-cli:${GITHUB_SHA} registry.adrianturnes.es/steam-explorer-cli:latest
          docker push registry.adrianturnes.es/steam-explorer-cli:latest
