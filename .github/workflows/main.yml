name: Master

on:
  push:
    branches: [ master ]

jobs:
  tests-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: build
        run: make install

      - name: composer
        run: make composer

      - name: unit tests
        run: make test-unit

  tests-acceptance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: build
        run: |
          make install
          cp .env.example .env
          make composer
          docker compose exec steam-php php artisan key:generate
          docker compose exec steam-database bash -c "until mysqladmin ping -h localhost --silent; do sleep 1; done"
          sleep 10
          docker compose exec steam-php php artisan migrate
          docker compose exec steam-php php artisan db:seed

      - name: Acceptance tests
        run: make test-acceptance

  tests-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: build
        run: |
          make install
          cp .env.example .env
          make composer
          docker compose exec steam-php php artisan key:generate
          docker compose exec steam-database bash -c "until mysqladmin ping -h localhost --silent; do sleep 1; done"
          sleep 10
          docker compose exec steam-php php artisan migrate
          docker compose exec steam-php php artisan db:seed

      - name: Integration tests
        run: make test-integration

  coverage:
    runs-on: ubuntu-latest
    needs: [ tests-unit, tests-integration, tests-acceptance ]
    steps:
      - uses: actions/checkout@v3

      - name: build
        run: |
          make install
          cp .env.example .env
          make composer
          docker compose exec steam-php php artisan key:generate
          docker compose exec steam-database bash -c "until mysqladmin ping -h localhost --silent; do sleep 1; done"
          sleep 10
          docker compose exec steam-php php artisan migrate
          docker compose exec steam-php php artisan db:seed

      - name: coverage
        run: make coverage-report

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-docker:
    runs-on: ubuntu-latest
    needs: [ tests-unit, tests-integration, tests-acceptance ]
    steps:
      - uses: actions/checkout@v4

      - name: Login to private registry
        run: |
          echo "${{ secrets.CF_ACCESS_CLIENT_SECRET }}" | \
          docker login ${{ secrets.REGISTRY_URL }} \
            -u "${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            --password-stdin

      - name: Build image
        run: |
          docker build -t registry.adrianturnes.es/pokedex:${{ github.sha }} .

      - name: Push image
        run: |
          docker push registry.adrianturnes.es/pokedex:${{ github.sha }}

